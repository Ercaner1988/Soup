name: CodSpeed

# Deliberately its own workflow, not a job in ci.yml (#1065): ci.yml's jobs
# are this repo's required checks, and a third-party benchmarking service
# must never be able to redden one. This workflow is not added to the
# required set by this change, and shouldn't be without a separate decision.
# If CodSpeed is slow, down, or changes its free-tier terms, this job can
# still fail on a real pytest error, but nothing about it blocks a merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # contents: read is checkout. id-token: write lets CodSpeedHQ/action mint
    # a short-lived OIDC token for CodSpeed's backend -- public-repo auth,
    # no CODSPEED_TOKEN secret stored here. Neither grants pull-requests:
    # write: the PR comment is posted by the separately installed CodSpeed
    # GitHub App using its own permissions, not by this workflow's token.
    #
    # GitHub does not grant id-token: write to a pull_request run triggered
    # from a fork, regardless of what this file requests -- a platform
    # restriction, not a CodSpeed one. Concretely: a PR from a branch of
    # this repository gets a CodSpeed comment; a PR from a fork still runs
    # this job and its test still passes or fails normally, but the OIDC
    # step has nothing to authenticate with, so no comparison is posted.
    # Most contributions here come from forks, so in practice this gate is
    # live for maintainer-branch PRs and silent on the rest until someone
    # decides a CODSPEED_TOKEN secret (and the trust it implies for a
    # fork's workflow run) is worth it.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Core dependencies only, no torch/transformers/[dev]'s heavier extras
      # -- the import this benchmarks is paid on every install, ML or not.
      - run: pip install -e . pytest pytest-codspeed
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest tests/test_cli_import_benchmark.py --codspeed -o addopts=""
